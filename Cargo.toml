[package]
edition = "2021"
name = "tilth"
version = "0.15.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Smart code reading for AI agents. Definitions, callers, deps and function-level diffs from tree-sitter."
homepage = "https://jahala.github.io/tilth/"
readme = "README.md"
keywords = [
    "mcp",
    "code-search",
    "tree-sitter",
    "developer-tools",
]
categories = [
    "command-line-utilities",
    "development-tools",
]
license = "MIT"
repository = "https://github.com/jahala/tilth"

[lib]
